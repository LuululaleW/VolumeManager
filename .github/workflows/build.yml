on:
  push:
    branches:
      - main
    paths-ignore:
      - README.md
  pull_request:
    branches:
      - main
    paths-ignore:
      - README.md
  workflow_dispatch:

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "gradle"

      - name: Build
        run: |
          set -o pipefail
          ./gradlew assembleRelease --console=plain 2>&1 | tee "$RUNNER_TEMP/gradle.log"

      - name: Report build failure
        if: failure()
        run: |
          log="$RUNNER_TEMP/gradle.log"
          if [ -f "$log" ]; then
            grep -E '^e: |error:|FAILURE:|What went wrong|Execution failed for task' "$log" | tail -40 | while IFS= read -r line; do
              line="${line//'%'/'%25'}"
              line="${line//$'\r'/'%0D'}"
              line="${line//$'\n'/'%0A'}"
              echo "::error title=Gradle failure::$line"
            done
          fi

      - name: Sign APK
        run: |
          echo "${{ secrets.KEYSTORE_FILE }}" | base64 -d > keystore.jks
          $ANDROID_HOME/build-tools/34.0.0/zipalign -c -v 4 app/build/outputs/apk/release/app-release-unsigned.apk
          $ANDROID_HOME/build-tools/34.0.0/apksigner sign \
            --ks keystore.jks \
            --ks-pass pass:${{ secrets.KEYSTORE_PASSWORD }} \
            --ks-key-alias ${{ secrets.KEY_ALIAS }} \
            --key-pass pass:${{ secrets.KEY_PASSWORD }} \
            app/build/outputs/apk/release/app-release-unsigned.apk

      - run: cp app/build/outputs/apk/release/app-release-unsigned.apk volume-manager.apk

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          path: volume-manager.apk
          archive: false
